name: release-gost

# 合体面板节点端:构建 hybrid gost(带 sing-box 支持)并发布成 release 资产,
# 让新节点用 install.sh 一键装就自带协议能力。
# 触发:推送 gost-v* 标签(与 docker 版本标签分开,不污染 :latest 生产镜像)。
#   git tag gost-v1 && git push origin gost-v1

on:
  push:
    tags:
      - 'gost-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod

      - name: Build hybrid gost (amd64 + arm64)
        working-directory: go-gost
        run: |
          release_version=$(cat ../VERSION)
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=mod -trimpath -ldflags "-s -w -X main.version=$release_version" -o ../dist/gost-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=mod -trimpath -ldflags "-s -w -X main.version=$release_version" -o ../dist/gost-arm64 .
          cp ../install.sh ../dist/install.sh
          (cd ../dist && sha256sum gost-amd64 gost-arm64 > checksums.sha256)
          ls -la ../dist

      # 先发 draft:action-gh-release 是「先建 release 再传 asset」,release 一建
      # latest 就立刻指向新 tag,而那会儿 30MB 的二进制还在传 —— 中间这一两分钟里
      # releases/latest/download/gost-amd64 是 404,正在装节点的人会莫名其妙地
      # 「下载失败」,而且看不出跟发版有关。draft 期间 latest 不动,传完再一次性放出来。
      - name: Publish release (draft first)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/gost-amd64
            dist/gost-arm64
            dist/install.sh
            dist/checksums.sha256
          body: |
            合体面板节点端 hybrid gost(内置 sing-box 下发/协议支持)。
            新节点安装:
            `curl -L https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh -o install.sh && chmod +x install.sh && GITHUB_REPO=${{ github.repository }} ./install.sh -a http://面板IP:6365 -s 节点密钥`

      # asset 全部就位后才真正发布并置为 latest,把上面那个 404 窗口彻底关掉
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
