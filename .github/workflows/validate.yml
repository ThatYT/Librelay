name: Validate deployment and protocol changes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      schema-mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: tms_schema_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TMS_SCHEMA_TEST_URL: jdbc:mysql://127.0.0.1:3306/tms_schema_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Backend tests and build
        run: mvn -B -f springboot-backend/pom.xml test package
      - name: Frontend tests and production build
        working-directory: vite-frontend
        run: |
          npm install -g pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Node regression and Linux build
        run: |
          cd go-gost/x
          go test ./socket ./handler/socks/v5 ./config/parsing/service
          cd ..
          CGO_ENABLED=0 go build -mod=mod -o /tmp/tms-gost .
      - name: Installer syntax and regression
        run: |
          bash -n panel_install.sh install.sh tms-hybrid.sh
          bash tests/installer_test.sh
      - name: Docker Compose validation
        run: |
          for compose in docker-compose-v4.yml docker-compose-v6.yml docker-compose-hybrid.yml; do
            docker compose --env-file .env.example -f "$compose" config --quiet
          done
      - name: Diff whitespace validation
        run: git diff --check
