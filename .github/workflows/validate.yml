name: Validate deployment and protocol changes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      schema-mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: tms_schema_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TMS_SCHEMA_TEST_URL: jdbc:mysql://127.0.0.1:3306/tms_schema_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Backend tests and build
        run: mvn -B -f springboot-backend/pom.xml test package
      - name: Backend image and login readiness smoke test
        env:
          MYSQL_SERVICE_ID: ${{ job.services.schema-mysql.id }}
        run: |
          docker build -t tms-backend:ci springboot-backend
          network=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$MYSQL_SERVICE_ID")
          export JWT_SECRET=$(openssl rand -hex 48)
          docker run -d --name tms-backend-ci --network "$network" \
            -e DB_HOST=schema-mysql -e DB_NAME=tms_schema_test -e DB_USER=root -e DB_PASSWORD= \
            -e JWT_SECRET -e LOG_DIR=/app/logs tms-backend:ci
          for attempt in $(seq 1 60); do
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' tms-backend-ci)
            if [ "$health" = healthy ]; then
              docker exec tms-backend-ci curl -fsS -X POST http://127.0.0.1:6365/api/v1/captcha/check
              exit 0
            fi
            sleep 3
          done
          docker logs tms-backend-ci --tail 100
          docker inspect -f '{{json .State.Health}}' tms-backend-ci
          exit 1
      - name: Clean up backend smoke container
        if: always()
        run: docker rm -f tms-backend-ci 2>/dev/null || true
      - name: Frontend tests and production build
        working-directory: vite-frontend
        run: |
          npm install -g pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Node regression and Linux build
        run: |
          cd go-gost/x
          go test ./socket ./handler/socks/v5 ./config/parsing/service
          cd ..
          CGO_ENABLED=0 go build -mod=mod -o /tmp/tms-gost .
      - name: Installer syntax and regression
        run: |
          bash -n panel_install.sh install.sh tms-hybrid.sh
          bash tests/installer_test.sh
          bash tests/node_installer_test.sh
          bash tests/domain_test.sh
      - name: Custom Caddy HTTPS port validation
        run: |
          export TMS_CADDY_FIXTURE_DIR="$RUNNER_TEMP/tms-caddy-test"
          bash tests/domain_test.sh
          docker run --rm -v "$TMS_CADDY_FIXTURE_DIR/Caddyfile":/etc/caddy/Caddyfile:ro \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate > "$TMS_CADDY_FIXTURE_DIR/config.json"
          jq -e '[.apps.http.servers[].listen[]] | index(":2095") != null' "$TMS_CADDY_FIXTURE_DIR/config.json"
          jq -e '[.apps.http.servers[].listen[]] | index(":443") == null' "$TMS_CADDY_FIXTURE_DIR/config.json"
          # Use local test certificates so CI never requests a public certificate.
          sed '/    tls {/,/^    }/d;s/    encode gzip/    tls internal\n    encode gzip/' \
            "$TMS_CADDY_FIXTURE_DIR/Caddyfile" > "$TMS_CADDY_FIXTURE_DIR/Caddyfile.local"
          docker network create tms-caddy-test
          docker run -d --name frontend --network tms-caddy-test nginx:alpine
          docker run -d --name reality-port-fixture -p 443:80 nginx:alpine
          docker run -d --name tms-caddy-test --network tms-caddy-test -p 80:80 -p 2095:2095 \
            -v "$TMS_CADDY_FIXTURE_DIR/Caddyfile.local":/etc/caddy/Caddyfile:ro caddy:2-alpine
          for attempt in $(seq 1 20); do
            if curl --noproxy '*' -fkSs --resolve panel.example.test:2095:127.0.0.1 \
                https://panel.example.test:2095/ > "$TMS_CADDY_FIXTURE_DIR/response"; then
              grep -q 'Welcome to nginx' "$TMS_CADDY_FIXTURE_DIR/response"
              curl --noproxy '*' -fsS http://127.0.0.1:443/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs tms-caddy-test
          exit 1
      - name: Clean up Caddy smoke containers
        if: always()
        run: |
          docker rm -f tms-caddy-test frontend reality-port-fixture 2>/dev/null || true
          docker network rm tms-caddy-test 2>/dev/null || true
      - name: Docker Compose validation
        run: |
          for compose in docker-compose-v4.yml docker-compose-v6.yml docker-compose-hybrid.yml; do
            docker compose --env-file .env.example -f "$compose" config --quiet
          done
      - name: Diff whitespace validation
        run: git diff --check
