# Installer template: image names are replaced with immutable commit tags.
services:
  mysql:
    image: mysql:5.7
    container_name: ${LIBRELAY_MYSQL_CONTAINER:-librelay-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # gost.sql 已包含全部 hybrid 表(协议/中转/线路),不要再挂 hybrid-schema-*.sql,
      # 否则里面的 ALTER TABLE 会二次执行报 1060,导致 MySQL 初始化中断。
      # 那三个文件保留着,供【已有旧库】单独执行升级用。
      - ./gost.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=256M
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    image: LIBRELAY_BACKEND_IMAGE
    container_name: ${LIBRELAY_BACKEND_CONTAINER:-librelay-backend}
    restart: unless-stopped
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-ThatYT/Librelay}
      GITHUB_REF: ${GITHUB_REF:-main}
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LOG_DIR: /app/logs
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT:-6365}:6365"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gost-network

  frontend:
    image: LIBRELAY_FRONTEND_IMAGE
    container_name: ${LIBRELAY_FRONTEND_CONTAINER:-librelay-frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-2095}:80"
    depends_on:
      - backend
    networks:
      - gost-network

volumes:
  mysql_data:
    name: ${LIBRELAY_MYSQL_VOLUME:-librelay_mysql_data}
    driver: local
  backend_logs:
    name: ${LIBRELAY_LOG_VOLUME:-librelay_backend_logs}
    driver: local

networks:
  gost-network:
    name: ${LIBRELAY_NETWORK:-librelay-network}
    driver: bridge
