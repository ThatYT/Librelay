plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseVersion = new File(rootProject.projectDir.parentFile, 'VERSION').text.trim()
if (!(releaseVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) throw new GradleException('Invalid numeric VERSION')
def versionParts = releaseVersion.tokenize('.').collect { it.toInteger() }
def releaseCode = versionParts[0] * 1000000L + versionParts[1] * 1000L + versionParts[2]
if (versionParts[1] > 999 || versionParts[2] > 999 || releaseCode > 2100000000L) throw new GradleException('VERSION exceeds Android versionCode range')

android {
    namespace 'com.librelay'
    compileSdk 34

    defaultConfig {
        applicationId "com.flux"
        minSdk 24
        targetSdk 34
        versionCode releaseCode.toInteger()
        versionName releaseVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/web-assets"
    }

    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
// Fail with actionable instructions instead of producing an APK with a blank WebView.
tasks.register('checkWebAssets') {
    doLast {
        if (!file("$buildDir/generated/web-assets/index.html").isFile()) {
            throw new GradleException('Build the frontend first: cd ../vite-frontend && pnpm build:android')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkWebAssets' }
