plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.librelay'
    compileSdk 34

    defaultConfig {
        applicationId "com.flux"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/web-assets"
    }

    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
// Fail with actionable instructions instead of producing an APK with a blank WebView.
tasks.register('checkWebAssets') {
    doLast {
        if (!file("$buildDir/generated/web-assets/index.html").isFile()) {
            throw new GradleException('Build the frontend first: cd ../vite-frontend && pnpm build:android')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkWebAssets' }
